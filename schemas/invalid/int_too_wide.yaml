# expect: exceeds the 64-bit limit
# why: wider than 64 bits has no natural Python or SystemVerilog integer type
name: tiny_framed
kind: framed
endian: big
header:
  name: hdr
  fields:
  - name: seq
    bytes: 4
  - name: count
    bytes: 2
messages:
  length:
    name: mlen
    bytes: 2
  type:
    name: mtype
    bytes: 1
  types:
  - name: alpha
    code: 1
    fields:
    - name: a
      bytes: 16
  - name: beta
    code: 2
    fields:
    - name: b
      bytes: 2

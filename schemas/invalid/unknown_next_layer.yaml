# expect: targets unknown layer 'nowhere'
# why: a dangling next-layer reference would abort the walk at runtime
name: tiny_layered
kind: layered
endian: big
start: outer
layers:
- name: outer
  fields:
  - name: sel
    bits: 8
  - name: pad
    bits: 8
  next:
    selector: sel
    map:
      1: inner
      2: nowhere
- name: inner
  fields:
  - name: payload_id
    bits: 16

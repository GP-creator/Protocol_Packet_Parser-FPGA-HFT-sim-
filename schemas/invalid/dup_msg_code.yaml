# expect: already used by message type 'alpha'
# why: two types sharing a code makes the discriminator ambiguous
name: tiny_framed
kind: framed
endian: big
header:
  name: hdr
  fields:
  - name: seq
    bytes: 4
  - name: count
    bytes: 2
messages:
  length:
    name: mlen
    bytes: 2
  type:
    name: mtype
    bytes: 1
  types:
  - name: alpha
    code: 1
    fields:
    - name: a
      bytes: 4
  - name: beta
    code: 1
    fields:
    - name: b
      bytes: 2

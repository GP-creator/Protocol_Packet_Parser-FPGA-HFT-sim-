# expect: little-endian field must be a whole number of bytes
# why: byte order is undefined for a field that is not whole bytes
name: tiny_framed
kind: framed
endian: big
header:
  name: hdr
  fields:
  - name: seq
    bytes: 4
  - name: count
    bytes: 2
messages:
  length:
    name: mlen
    bytes: 2
  type:
    name: mtype
    bytes: 1
  types:
  - name: alpha
    code: 1
    fields:
    - name: a
      bytes: 4
    - name: odd
      bits: 12
      endian: little
  - name: beta
    code: 2
    fields:
    - name: b
      bytes: 2

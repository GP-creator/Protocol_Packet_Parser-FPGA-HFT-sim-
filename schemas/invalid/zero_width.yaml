# expect: width must be positive
# why: a zero-width field has no bit slice
name: tiny_layered
kind: layered
endian: big
start: outer
layers:
- name: outer
  fields:
  - name: sel
    bits: 0
  - name: pad
    bits: 8
  next:
    selector: sel
    map:
      1: inner
- name: inner
  fields:
  - name: payload_id
    bits: 16

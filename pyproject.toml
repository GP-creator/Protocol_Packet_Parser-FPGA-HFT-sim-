[project]
name = "wirespec"
version = "0.1.0"
description = "Schema-driven SystemVerilog packet parser generator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1"]

[project.scripts]
wirespec = "wirespec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
